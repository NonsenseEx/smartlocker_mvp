{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow border-danger">
            <div class="card-body">
                <h3 class="text-danger mb-4">¿Eliminar Equipo?</h3>
                <p>Estás a punto de eliminar <strong>{{ equipo.nombre }} ({{ equipo.codigo }})</strong> del catálogo. Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100 mb-2">Sí, Eliminar Definitivamente</button>
                    <a href="{% url 'gestion_inventario' %}" class="btn btn-secondary w-100">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
