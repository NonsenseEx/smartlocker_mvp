{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow auth-card">
            <div class="card-header text-center">
                <span class="d-block fs-1 mb-1">🔐</span>
                <h4 class="mb-0">Ingreso a SmartLocker</h4>
                <small class="text-muted">Pañol universitario</small>
            </div>
            <div class="card-body">
                <h3 class="text-center mb-4 h5">Bienvenido de nuevo</h3>
                
                <!-- Si el usuario se equivoca, mostramos error -->
                {% if form.errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario:</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
