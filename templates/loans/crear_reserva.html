{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Reservar Equipo</h4>
            </div>
            <div class="card-body">
                <h5>Equipo: {{ equipo.nombre }}</h5>
                <p class="text-muted">Código: {{ equipo.codigo }}</p>
                <hr>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Seleccione el bloque horario:</label>
                        <select name="bloque_horario" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="Lunes 08:00 - 10:00">Lunes 08:00 - 10:00</option>
                            <option value="Lunes 10:00 - 12:00">Lunes 10:00 - 12:00</option>
                            <option value="Martes 14:00 - 16:00">Martes 14:00 - 16:00</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Confirmar Reserva</button>
                    <a href="{% url 'catalogo' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
