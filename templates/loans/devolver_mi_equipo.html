{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Devolver Equipo</h4>
            </div>
            <div class="card-body">
                <h5>Equipo: {{ prestamo.reserva.equipo.nombre }}</h5>
                <hr>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">¿En qué estado devuelves el equipo?</label>
                        <select name="estado_equipo" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option value="operativo">Operativo (Buen estado)</option>
                            <option value="danado">Dañado (Requiere revisión)</option>
                            <option value="faltante">Faltante (Faltan piezas)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Confirmar Devolución</button>
                    <a href="{% url 'mis_prestamos' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
